name: Build Marauder C5 PCB3501S

# Builds ESP32 Marauder for: XH-C5E (ESP32-C5) + 3.5" PCB3501S (ILI9488 + XPT2046)
# Run it from the Actions tab -> "Build Marauder C5 PCB3501S" -> Run workflow.

on:
  workflow_dispatch:
  push:

env:
  MARAUDER_SHA: d9197cf063cede379104ca8673c2d952d66575a3
  IDF_VER: "3.3.4"
  FQBN: "esp32:esp32:esp32c5:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=enabled"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP32 Marauder source
        uses: actions/checkout@v4
        with:
          repository: justcallmekoko/ESP32Marauder
          ref: ${{ env.MARAUDER_SHA }}

